name: Build

# A push to main or a pull request only proves the app still compiles; nothing
# is kept. Publishing happens on a version tag — see the release step.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# A release made in the web UI fires twice (the tag push and the release
# itself). Both runs carry the same tag ref, so the later one supersedes the
# earlier and only one build happens.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted Apple Silicon. Nothing else has to be installed: libghostty
    # arrives as a checksum-verified xcframework that SwiftPM downloads, and
    # ghostty's runtime resources are checked in under Resources/ghostty-share.
    runs-on: macos-26

    # Attaching the app to a release is a write to the repository.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The macos-26 image already defaults to Xcode 26; this only pins it
      # explicitly when a versioned copy is present, and never fails the run
      # over a path that varies between image releases.
      - name: Select Xcode
        run: |
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version

      # CodeEditLanguages vendors every tree-sitter grammar, so its repository
      # is ~600 MB. Caching SwiftPM's clone is what keeps the build reasonable.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: .build/xcode
          key: derived-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: derived-${{ runner.os }}-

      # VERSION is what the bundle reports and what the in-app updater compares
      # against the latest release, so a tag build has to carry its own tag —
      # the shallow checkout cannot always work one out for itself.
      - name: Build universal app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          APP="$(Scripts/bundle.sh Release)"
          echo "APP=$APP" >> "$GITHUB_ENV"

      # Fail loudly if the binary came out single-architecture.
      - name: Verify architectures
        run: |
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Workspace")"
          echo "$ARCHS"
          grep -q arm64 <<< "$ARCHS"
          grep -q x86_64 <<< "$ARCHS"

      # Everything below only runs for a version tag. `gh release create` fails
      # if the release already exists — which it does when the tag came from a
      # release made in the web UI — so create it only when missing and always
      # upload afterwards, which makes re-running the job harmless.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ditto -c -k --keepParent "$APP" Workspace.zip

          # The disk image is the familiar way to install a Mac app: mount it,
          # drag the app onto the Applications alias sitting beside it. Both
          # are just the contents of a staging folder hdiutil compresses.
          STAGE="$(mktemp -d)/Workspace"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Workspace -srcfolder "$STAGE" -ov -format UDZO Workspace.dmg

          NOTES=$(cat <<'EOF'
          Open `Workspace.dmg` and drag Workspace onto the Applications folder
          beside it. (`Workspace.zip` holds the same app, for anyone who would
          rather unzip it.)

          The app is signed ad-hoc rather than with a Developer ID, so macOS
          refuses it on first launch — "Apple could not verify Workspace is
          free of malware". Clear the download flag once, after installing:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Workspace.app
          ```

          Or open **System Settings → Privacy & Security** and click **Open
          Anyway** at the bottom. Only notarization removes the warning for
          good, and that needs a paid Apple Developer account.

          Requires macOS 14 or later. Universal (Apple Silicon and Intel).
          EOF
          )

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --notes "$NOTES"
          fi
          gh release upload "$TAG" Workspace.dmg Workspace.zip --clobber
